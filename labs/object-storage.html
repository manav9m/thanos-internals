<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template - Thanos Internals</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <header>
        <div class="logo">
            <h1><a href="../index.html" style="color: inherit; text-decoration: none;">Thanos Internals Lab</a></h1>
            <span class="subtitle">Module: Template</span>
        </div>
        <div class="progress-tracker">
            <button id="mark-complete-btn" class="primary">Mark Lab Complete</button>
        </div>
    </header>

    <main style="padding: 1rem;">
        <div class="lab-container">
            <div class="lab-sidebar">
                <h2>Under Construction</h2>
                <p>This lab template is ready to be implemented following the Compactor example.</p>
                <h3>References</h3>
                <ul>
                    <li><a href="https://thanos.io/" target="_blank">Thanos Documentation</a></li>
                </ul>
            </div>
            <div class="lab-main">
                <div class="simulation-panel">
                    <div class="simulation-header">
                        <strong>Visual Simulation: Placeholder</strong>
                    </div>
                    <div class="simulation-canvas" style="display:flex; align-items:center; justify-content:center; color: #888;">
                        Simulation Canvas Placeholder
                    </div>
                </div>
                <div class="controls-panel">
                    <h3>Controls & Flags</h3>
                    <p>No controls active for this template.</p>
                </div>
            </div>
        </div>
    </main>

    <script src="../js/app.js"></script>
    <script>
        // Basic completion hook
        const labId = window.location.pathname.split('/').pop().replace('.html', '');
        const btnComplete = document.getElementById('mark-complete-btn');
        if (window.ThanosApp && window.ThanosApp.state.isCompleted(labId)) {
            btnComplete.textContent = "✓ Completed";
            btnComplete.disabled = true;
        }
        btnComplete.addEventListener('click', () => {
            if (window.ThanosApp) {
                window.ThanosApp.markLabComplete(labId);
                btnComplete.textContent = "✓ Completed";
                btnComplete.disabled = true;
            }
        });
    </script>
</body>
</html>
